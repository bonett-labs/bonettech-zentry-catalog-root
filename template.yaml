# ============================================
# CATALOG ROOT - BONETTTECH
# Arquivo raiz que aponta para todas as entidades do catálogo
# ============================================

apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: bonetttech-catalog-root
  title: BonettTech Catalog Root
  description: Ponto de entrada principal para o catálogo do Backstage da BonettTech
  annotations:
    backstage.io/managed-by-location: url:https://github.com/bonetttech/backstage-catalog/blob/main/catalog-info.yaml
spec:
  type: url
  targets:
    # Estrutura Organizacional (Groups)
    - https://github.com/bonetttech/backstage-catalog/blob/main/groups/organizational-structure.yaml
    
    # Domínios de Negócio
    - https://github.com/bonetttech/backstage-catalog/blob/main/domains/all-domains.yaml
    
    # Sistemas
    - https://github.com/bonetttech/backstage-catalog/blob/main/systems/all-systems.yaml
    
    # Componentes (Services/Apps)
    - https://github.com/bonetttech/backstage-catalog/blob/main/components/all-components.yaml
    
    # Resources (Infraestrutura)
    - https://github.com/bonetttech/backstage-catalog/blob/main/resources/all-resources.yaml
    
    # Templates
    - https://github.com/bonetttech/backstage-catalog/blob/main/templates/template-locations-github.yaml
    
    # Tech Radar
    - https://github.com/bonetttech/backstage-catalog/blob/main/tech-radar/tech-radar.json
